<script>
$(document).ready(function () {
  let swiperInstances = [];

  function initializeSwiper() {
    // Destroy existing Swiper instances on resize
    swiperInstances.forEach((swiper) => swiper.destroy(true, true));
    swiperInstances = [];

    $(".container-testimonial").each(function () {
      const $this = $(this);
      const nextEl = $this.find(".swiper-next")[0];
      const prevEl = $this.find(".swiper-prev")[0];

      if (nextEl && prevEl) {
        const isSmallScreen = $(window).width() < 992; // Check if the screen is smaller than 992px

        const reviewSwiper = new Swiper(
          $this.find(".swiper.is-slider-testimonial")[0],
          {
            slidesPerView: "auto",
            loop: !isSmallScreen, // Disable loop on small screens
            followFinger: true,
            freeMode: false,
            spaceBetween: "15%",
            autoplay: isSmallScreen ? false : { // Disable autoplay on small screens
              delay: 5000,
              disableOnInteraction: false,
            },
            speed: 800,
            keyboard: {
              enabled: true,
              onlyInViewport: true,
            },
            slideActiveClass: "is-active",
            slideDuplicateActiveClass: "is-active",
            navigation: {
              nextEl,
              prevEl,
            },
          }
        );

        swiperInstances.push(reviewSwiper); // Track this instance

        // Pause autoplay and move to the next slide
        $this.find(".swiper-next").on("click", function () {
          reviewSwiper.autoplay.stop();
          reviewSwiper.slideNext();
          setTimeout(function () {
            reviewSwiper.autoplay.start();
          }, 2000);
        });

        // Pause autoplay and move to the previous slide
        $this.find(".swiper-prev").on("click", function () {
          reviewSwiper.autoplay.stop();
          reviewSwiper.slidePrev();
          setTimeout(function () {
            reviewSwiper.autoplay.start();
          }, 2000);
        });

        // Stop autoplay on hover
        $this.on("mouseenter", function () {
          reviewSwiper.autoplay.stop();
        });

        // Resume autoplay on mouse leave
        $this.on("mouseleave", function () {
          reviewSwiper.autoplay.start();
        });
      } else {
        console.error("Navigation elements not found.");
      }
    });
  }

  // Delay Swiper initialization
  setTimeout(initializeSwiper, 1000);

  // Re-initialize on window resize
  $(window).on("resize", initializeSwiper);
});
</script>
<script>
gsap.registerPlugin(ScrollTrigger);

// Function for the main grid animation (at least 20 blocks at 0%)
function animateMainGrid() {
  const items = Array.from(document.querySelectorAll(".bg-grid_item"));

  if (items.length === 0) {
    console.warn("No .bg-grid_item elements found.");
    return;
  }

  gsap.set(items, { height: "100%", width: "100%" });
  
  const maxZeroBlocks = 24;
  const minZeroBlocks = 20;
  
  let mainGridTimeline = gsap.timeline({ paused: true });

  function randomBlockAnimation() {
    let currentZeroBlocks = items.filter(item => item.style.height === "0%" || item.style.width === "0%");
    let remainingBlocks = items.filter(item => !currentZeroBlocks.includes(item));

    if (currentZeroBlocks.length < minZeroBlocks) {
      let blockToShow = gsap.utils.shuffle(remainingBlocks).slice(0, 1)[0];
      let showDimension = Math.random() < 0.5 ? "height" : "width";
      mainGridTimeline.to(blockToShow, {
        [showDimension]: "0%",
        duration: 1,
        ease: "power2.inOut",
        onComplete: randomBlockAnimation
      });
    } else if (currentZeroBlocks.length > maxZeroBlocks) {
      let blockToHide = gsap.utils.shuffle(currentZeroBlocks).slice(0, 1)[0];
      let hideDimension = Math.random() < 0.5 ? "height" : "width";
      mainGridTimeline.to(blockToHide, {
        [hideDimension]: "100%",
        duration: 1,
        ease: "power2.inOut",
        onComplete: randomBlockAnimation
      });
    } else {
      let blockToHide = gsap.utils.shuffle(currentZeroBlocks).slice(0, 1)[0];
      let blockToShow = gsap.utils.shuffle(remainingBlocks).slice(0, 1)[0];
      let hideDimension = Math.random() < 0.5 ? "height" : "width";
      let showDimension = Math.random() < 0.5 ? "height" : "width";

      mainGridTimeline.to(blockToHide, {
        [hideDimension]: "100%",
        duration: 1,
        ease: "power2.inOut"
      });

      mainGridTimeline.to(blockToShow, {
        [showDimension]: "0%",
        duration: 1,
        ease: "power2.inOut",
        onComplete: randomBlockAnimation
      });
    }
  }

  // Set 20 blocks to 0% simultaneously at the start (no animation)
  function setInitialZeroBlocks() {
    let randomItems = gsap.utils.shuffle(items).slice(0, 20);  // Select 20 random items

    randomItems.forEach(item => {
      let dimension = Math.random() < 0.5 ? "height" : "width";  // Randomly choose between height or width
      gsap.set(item, { [dimension]: "0%" });  // Set the chosen dimension to 0% instantly
    });

    gsap.delayedCall(1, randomBlockAnimation);  // Start the continuous animation after the initial setup
  }

  setInitialZeroBlocks();
  mainGridTimeline.play();

  ScrollTrigger.create({
    trigger: ".bg-grid",
    start: "top 80%",
    onLeave: () => {
      mainGridTimeline.pause();
    },
    onEnterBack: () => {
      mainGridTimeline.resume();
    }
  });
}

//Text split animation
window.addEventListener("DOMContentLoaded", (event) => {
  
  let typeSplit = new SplitType("[text-split]", {
    types: "words, chars",
    tagName: "span"
  });

  function createScrollTrigger(triggerElement, timeline) {
    
    ScrollTrigger.create({
      trigger: triggerElement,
      start: "top bottom",
      onLeaveBack: () => {
        timeline.progress(0);
        timeline.pause();
      }
    });
    
    ScrollTrigger.create({
      trigger: triggerElement,
      start: "top 80%",
      onEnter: () => timeline.play()
    });
  }

  $("[words-slide-up]").each(function (index) {
    let tl = gsap.timeline({ paused: true });
    tl.from($(this).find(".word"), { opacity: 0, yPercent: 100, duration: 0.7, ease: "back.out(2)", stagger: { amount: 0.5 } });
    createScrollTrigger($(this), tl);
  });

  $("[words-slide-from-right]").each(function (index) {
    let tl = gsap.timeline({ paused: true });
    tl.from($(this).find(".word"), { opacity: 0, x: "1em", duration: 0.6, ease: "power2.out", stagger: { amount: 0.2 } });
    createScrollTrigger($(this), tl);
  });

  $("[letters-slide-up]").each(function (index) {
    let tl = gsap.timeline({ paused: true });
    tl.from($(this).find(".char"), { yPercent: 120, duration: 0.7, ease: "power1.out", stagger: { amount: 0.6 } });
    createScrollTrigger($(this), tl);
  });

  $("[letters-slide-down]").each(function (index) {
    let tl = gsap.timeline({ paused: true });
    tl.from($(this).find(".char"), { yPercent: -120, duration: 0.4, ease: "power1.out", stagger: { amount: 0.3 } });
    createScrollTrigger($(this), tl);
  });

  $("[letters-fade-in-random]").each(function (index) {
    let tl = gsap.timeline({ paused: true });
    tl.from($(this).find(".char"), { opacity: 0, duration: 0.05, ease: "power1.out", stagger: { amount: 0.4, from: "random" } });

   $("[letters-slide-up-random]").each(function (index) {

  $("[scrub-each-word]").each(function (index) {

// Gallery animation

document.querySelectorAll('.gallery-loop').forEach(loop => {
  const isReverse = loop.classList.contains('reverse');

  // Function to set the duration based on screen size
  function getDuration() {
    const screenWidth = window.innerWidth;
    if (screenWidth < 480) {
      return 20; // 20s for screens smaller than 480px
    } else if (screenWidth < 991) {
      return 30; // 30s for screens smaller than 991px
    } else {
      return 40; // Default 40s for larger screens
    }
  }

  // Duplicate the images inside for seamless looping
  let items = loop.querySelectorAll('.gallery-img');
  items.forEach(item => loop.appendChild(item.cloneNode(true)));

  // Create the animation
  const animation = gsap.to(loop, {
    xPercent: isReverse ? 100 : -100, // Scroll direction
    ease: "none",
    duration: getDuration(), // Use responsive duration
    repeat: -1, // Infinite loop
    modifiers: {
      xPercent: gsap.utils.wrap(-100, 0) // Seamless looping effect
    }
  });

  // Update the animation duration on window resize
  window.addEventListener('resize', () => {
    animation.duration(getDuration()); // Adjust speed on screen resize
  });
});
</script>
